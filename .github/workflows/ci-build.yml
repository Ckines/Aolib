name: CI / build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Build (platform: ${{ matrix.platform }}, psf: ${{ matrix.use_psf }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30   # red de seguridad: si algo se cuelga, GitHub Actions lo mata y falla claro, en vez de quedarse "colgado" indefinidamente
    strategy:
      matrix:
        platform: [linux, windows]   # "windows" cross-compiles on Linux via mingw-w64
        use_psf: [true, false]       # true = release config (PSF/PSF2/SSF, non-commercial
                                      # restriction applies); false = BSD/MIT/LGPL/GPL-only build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          # El sed anterior sobre ubuntu.sources no servía de nada: el log
          # real de un run fallido empieza con "Get:1 file:/etc/apt/apt-
          # mirrors.txt Mirrorlist" -- los runners de GitHub (alojados en
          # Azure) usan el transporte mirror+file: de apt, así que el
          # dominio "azure.archive.ubuntu.com" que sale en el log no vive
          # literalmente en ubuntu.sources (que apunta a
          # mirror+file:/etc/apt/apt-mirrors.txt) sino en ese
          # apt-mirrors.txt, que el sed nunca tocaba. El fallo tampoco es
          # una conexión caída -- las descargas SÍ avanzan, solo que muy
          # despacio (paquete de 35 MB tras 35 MB), lo que no dispara
          # Acquire::http::Timeout porque ese timeout es de "sin datos
          # nuevos", no un límite total de transferencia.
          #
          # Arreglo real: sustituir ubuntu.sources entero por URIs
          # literales a archive.ubuntu.com/security.ubuntu.com, sin pasar
          # por mirror+file: en ningún momento. Con printf, no echo
          # multilínea, para que cada línea de la sangría quede clara.
          printf '%s\n' \
            'Types: deb' \
            'URIs: http://archive.ubuntu.com/ubuntu/' \
            'Suites: noble noble-updates noble-backports' \
            'Components: main universe restricted multiverse' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            '' \
            'Types: deb' \
            'URIs: http://security.ubuntu.com/ubuntu/' \
            'Suites: noble-security' \
            'Components: main universe restricted multiverse' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            | sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null

          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo apt-get update -y $APT_OPTS
          sudo apt-get install -y $APT_OPTS build-essential
          if [ "${{ matrix.platform }}" = "windows" ]; then
            sudo apt-get install -y $APT_OPTS g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64
            sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-win32
            sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-win32
          fi

      - name: Show toolchain versions
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            x86_64-w64-mingw32-g++ --version
          else
            g++ --version
          fi

      # Object files, keyed per platform/psf combination so the four matrix
      # legs never share (or corrupt) each other's cache.
      - name: Cache build objects
        uses: actions/cache@v5
        with:
          path: |
            **/*.o
            **/*.d
          key: >-
            ${{ matrix.platform }}-psf${{ matrix.use_psf }}-
            ${{ hashFiles('Makefile', '**/*.c', '**/*.cpp', '**/*.h', '**/*.hpp') }}
          restore-keys: |
            ${{ matrix.platform }}-psf${{ matrix.use_psf }}-

      - name: Build
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            make all USE_PSF_ENGINE=$([ "${{ matrix.use_psf }}" = "true" ] && echo 1 || echo 0) PLATFORM=windows
            mkdir -p dist-windows
            cp aolib_libretro.dll dist-windows/
            cp aolib_libretro.info dist-windows/
          else
            make all USE_PSF_ENGINE=$([ "${{ matrix.use_psf }}" = "true" ] && echo 1 || echo 0)
            mkdir -p dist-linux
            cp aolib_libretro.so dist-linux/
            cp aolib_libretro.info dist-linux/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: aolib-${{ matrix.platform }}-psf${{ matrix.use_psf }}
          path: |
            dist-linux/*
            dist-windows/*
          if-no-files-found: error
