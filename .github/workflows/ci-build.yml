name: CI / build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Build (platform: ${{ matrix.platform }}, psf: ${{ matrix.use_psf }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30   # red de seguridad: si algo se cuelga, GitHub Actions lo mata y falla claro, en vez de quedarse "colgado" indefinidamente
    strategy:
      matrix:
        platform: [linux, windows]   # "windows" cross-compiles on Linux via mingw-w64
        use_psf: [true, false]       # true = release config (PSF/PSF2/SSF, non-commercial
                                      # restriction applies); false = BSD/MIT/LGPL/GPL-only build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          # azure.archive.ubuntu.com (el mirror por defecto de los runners
          # de GitHub) falla intermitentemente; sin límites explícitos,
          # apt reintenta en silencio y el paso se queda "colgado" en vez
          # de fallar rápido o caer al mirror alternativo. Retries=3 +
          # timeouts cortos fuerzan ese fallback en segundos, no minutos.
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo apt-get update -y $APT_OPTS
          sudo apt-get install -y $APT_OPTS build-essential
          if [ "${{ matrix.platform }}" = "windows" ]; then
            sudo apt-get install -y $APT_OPTS g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64
            sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-win32
            sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-win32
          fi

      - name: Show toolchain versions
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            x86_64-w64-mingw32-g++ --version
          else
            g++ --version
          fi

      # Object files, keyed per platform/psf combination so the four matrix
      # legs never share (or corrupt) each other's cache.
      - name: Cache build objects
        uses: actions/cache@v5
        with:
          path: |
            **/*.o
            **/*.d
          key: >-
            ${{ matrix.platform }}-psf${{ matrix.use_psf }}-
            ${{ hashFiles('Makefile', '**/*.c', '**/*.cpp', '**/*.h', '**/*.hpp') }}
          restore-keys: |
            ${{ matrix.platform }}-psf${{ matrix.use_psf }}-

      - name: Build
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            make all USE_PSF_ENGINE=$([ "${{ matrix.use_psf }}" = "true" ] && echo 1 || echo 0) PLATFORM=windows
            mkdir -p dist-windows
            cp aolib_libretro.dll dist-windows/
            cp aolib_libretro.info dist-windows/
          else
            make all USE_PSF_ENGINE=$([ "${{ matrix.use_psf }}" = "true" ] && echo 1 || echo 0)
            mkdir -p dist-linux
            cp aolib_libretro.so dist-linux/
            cp aolib_libretro.info dist-linux/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: aolib-${{ matrix.platform }}-psf${{ matrix.use_psf }}
          path: |
            dist-linux/*
            dist-windows/*
          if-no-files-found: error
